            <form>
                <fieldset>
                    <legend><strong>Your details</strong></legend>
                    <label for="name"><strong>Your Name</strong></label>
                    <input type="text" id="name" name="name" placeholder="enter your name. Ex:Jhony" required minlength="3" maxlength="20">

                    <label for="email"><strong>Your Email</strong></label>

                        <option value="ent'nt">Entertainment</option>
                    </select>
                    <label for="write"><strong>message</strong></label>
                    <textarea id="write" name="write" placeholder="type here your feedback" rows="2"
                        cols="20"></textarea>
                    <button type="submit">Send</button>

                </fieldset>
                <br>
                <label for="pwd"><strong>Your password</strong></label>
                <input type="password" id="pwd" name="pwd" placeholder="enter your password." >
                <br>
                <label for="phone_No"><strong>Your Mobile No</strong></label>
                <input type="tel" id="phone_No" name="Phone_No" placeholder="enter your telephone No" >
                <br>
                <label for="Date"><strong>Enter date</strong></label>
                <input type="date" id="Date" name="Date" placeholder="enter todays date" >
                <br>
                <label for="Nom"><strong>Number</strong></label>
                <input type="number" id="Nom" name="Nom" placeholder="enter the Number" >
                <br>
                <label for="check"><strong>tick the checkbox</strong></label>
                <input type="checkbox" id="check" name="check" >
                <br>
